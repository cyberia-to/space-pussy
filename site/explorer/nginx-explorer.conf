# spacepussy.ai/explorer — include inside the `server { server_name spacepussy.ai; listen 443 ssl; … }` block of the vhost:
#     include /etc/nginx/snippets/nginx-explorer.conf;
# the page is static (site/explorer/); its data is the node's read API, proxied same-origin under /explorer/api/.
# upstream: the edge's pussy-rc node, 127.0.0.1:7783 (the alpha rehearsal). for `pussy` at genesis change both
# proxy_pass lines to 127.0.0.1:7781 — the page needs no change.
#
# this zone goes once in http{} (e.g. /etc/nginx/conf.d/pussy-explorer-zone.conf):
#     limit_req_zone $binary_remote_addr zone=pussy_explorer:10m rate=10r/s;
#
# only GET (and HEAD, which GET implies) of the read paths reach the node; everything else under /explorer/api/ is 404.
# never proxied: POST /tx, /submit, /template, /checkpoints, /v2/history, /dev/*, /health, and /peers (it lists the
# peers' addresses; the network tab reads data/network.json, which never carries one).

# the page itself: index.html revalidated every load, the hash routes never reach the server
location /explorer/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /explorer/index.html;
}

# the indexer's files (site/explorer/indexer, runit `explorer-index`): history.json, stakes.json, summary.json, network.json,
# rewritten whole every ~30 s; a missing file is a 404, never the page; half-written .tmp files are never served
location ~ "^/explorer/data/.*\.tmp$" {
    return 404;
}
location /explorer/data/ {
    try_files $uri =404;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    add_header Cache-Control "public, max-age=10" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}

# immutable reads: a block or a header by id or height, a transaction — a few seconds of cache
location ~ "^/explorer/api/(?:(?:block|header)/(?:[0-9a-f]{64}|[0-9]{1,12})|tx/[0-9a-f]{64})$" {
    limit_except GET { deny all; }
    limit_req zone=pussy_explorer burst=40 nodelay;
    limit_req_status 429;
    rewrite ^/explorer/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:7783;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=10" always;
    add_header X-Content-Type-Options nosniff always;
}

# moving reads: the tip, the state, lists, neurons, epochs, focus — never cached
location ~ "^/explorer/api/(?:tip|status|stats|root|economy|mempool|blocks|epochs|focus|epoch/[0-9]{1,10}|(?:focus|card|cards|balance|balances|nonce)/[0-9a-f]{64})$" {
    limit_except GET { deny all; }
    limit_req zone=pussy_explorer burst=40 nodelay;
    limit_req_status 429;
    rewrite ^/explorer/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:7783;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# everything else under the API prefix
location /explorer/api/ {
    return 404;
}
