# the nodes we run on pussy-rc — their names on the network tab (network.py). endpoint = the radio endpoint id
# (/peers, /status `endpoint:`); neuron = the node's neuron, the default hash of its radio key when the node runs
# without --neuron (cybernode rs/src/node/chain_node.rs; both run without it, 2026-11-02; values from cyber-hemera 0.4);
# miner = where its miner's coinbase goes; ip only places the dot and is never published; a node behind NAT has none.

